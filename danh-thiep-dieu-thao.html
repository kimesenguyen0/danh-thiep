<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002B69">
<title>Nguyễn Lê Diệu Thảo · Asahi Life</title>
<style>
  :root {
    --bg: #002B69;
    --bg-deep: #001C47;
    --fg: #FFFFFF;
    --fg-soft: rgba(255,255,255,.72);
    --line: rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(120% 70% at 50% 0%, #0A3C85 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--fg);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .avatar {
    width: 132px;
    height: 132px;
    margin: 0 auto 28px;
    border-radius: 50%;
    padding: 5px;
    border: 1.5px solid var(--line);
  }
  .avatar img,
  .avatar .initial {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
  }
  .avatar img { object-fit: cover; }
  .avatar .initial {
    background: var(--fg);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  h1 {
    font-size: clamp(24px, 7vw, 28px);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -.01em;
  }
  .role {
    margin-top: 8px;
    font-size: 16px;
    color: var(--fg-soft);
    line-height: 1.5;
  }
  .rule {
    width: 40px;
    height: 1.5px;
    background: var(--line);
    margin: 28px auto;
    border: 0;
  }
  .tagline {
    font-size: 18px;
    line-height: 1.5;
    font-style: italic;
  }
  .tagline cite {
    display: block;
    margin-top: 6px;
    font-size: 14px;
    font-style: normal;
    color: var(--fg-soft);
  }
  .save {
    margin-top: 40px;
    width: 100%;
    padding: 16px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform .15s ease, background .15s ease;
  }
  .save:hover { background: #E8EEF8; }
  .save:active { transform: scale(.98); }
  .save:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .save svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: reduce) { .save { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="avatar"></div>

    <h1>Nguyễn Lê Diệu Thảo</h1>
    <p class="role">Senior Specialist<br>Asahi Life</p>

    <hr class="rule">

    <p class="tagline" id="tagline"></p>

    <button class="save" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      Lưu vào danh bạ
    </button>
  </main>

      "FN;CHARSET=UTF-8:" + esc(contact.full),
      "TITLE;CHARSET=UTF-8:" + esc(contact.title),
      "ORG;CHARSET=UTF-8:" + esc(contact.org),
      "TEL;TYPE=CELL,VOICE:" + contact.tel,
      "EMAIL;TYPE=INTERNET,WORK:" + contact.email,
      "ADR;TYPE=WORK;CHARSET=UTF-8:;;;" + esc(contact.city) + ";;;Việt Nam"
    ];
    if (PHOTO) {
      const p = PHOTO.match(/^data:image\/(\w+);base64,(.+)$/);
      if (p) {
        const photoLine = "PHOTO;ENCODING=b;TYPE=" + p[1].toUpperCase().replace("JPG", "JPEG") + ":" + p[2];
        lines.push(photoLine.match(/.{1,74}/g).join("\r\n "));
      }
    }
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  document.getElementById("saveBtn").addEventListener("click", function () {
    const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Nguyen_Le_Dieu_Thao.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
</script>
</body>
</html>
